name: Build apps

# Windows .exe ve macOS .app dosyalarını otomatik üretir.
# Çıktılar: Actions sekmesi → ilgili çalışma → Artifacts.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ";"
            onefile: "--onefile"
            artifact: SamfunnskunnskapQuiz-Windows
            path: dist/SamfunnskunnskapQuiz.exe
          - os: macos-latest
            sep: ":"
            onefile: ""
            artifact: SamfunnskunnskapQuiz-macOS
            path: dist/SamfunnskunnskapQuiz.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Paketle (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed ${{ matrix.onefile }}
          --name SamfunnskunnskapQuiz
          --add-data "samfunnskunnskap_quiz.html${{ matrix.sep }}."
          app.py

      - name: Çıktıyı yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
